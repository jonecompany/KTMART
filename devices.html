<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="KT마트 워치 태블릿 상품 안내"><title>워치·태블릿 | KT마트</title><link rel="stylesheet" href="assets/styles.css"></head><body><main>
<section class="page-hero"><div class="container"><div class="section-eyebrow">워치 / 태블릿</div><h1>KT 워치와 태블릿을<br>한눈에 확인하세요</h1><p class="section-desc">KT 공식 온라인샵에서 현재 확인되는 갤럭시·Apple 스마트기기 라인업을 추가했습니다.</p></div></section>
<section class="products-section"><div class="container"><div class="toolbar"><div class="filter-row"><button class="tab active" data-dfilter="all">전체</button><button class="tab" data-dfilter="samsung">삼성</button><button class="tab" data-dfilter="apple">애플</button><button class="tab" data-dfilter="watch">워치</button><button class="tab" data-dfilter="tablet">태블릿</button></div><select class="sort-select" id="sort"><option value="recommend">추천순</option><option value="low">월 납부 낮은순</option><option value="high">월 납부 높은순</option></select></div><div class="device-grid" id="deviceGrid"></div><div class="source-note">※ 표시된 월 납부 예시는 KT 공식 온라인샵 노출 기준을 참고한 값이며, 실제 KT마트 상담 조건·할부기간·요금제·지원금에 따라 달라질 수 있습니다.</div></div></section></main>
<script src="assets/data.js"></script><script src="assets/app.js"></script><script>
base('devices');let deviceList=[...KTMART_DEVICES];let df='all';
function deviceCard(d){return `<a class="device-card" href="consult.html?model=${encodeURIComponent(d.name)}" data-brand="${d.category}" data-type="${d.type}"><span class="badge">${d.badge}</span><div class="product-img"><img src="${d.img}" alt="${d.name}" loading="lazy" onerror="this.style.display='none';this.parentNode.innerHTML='<div style=\'font-size:46px\'>${d.type==='watch'?'⌚':'▣'}</div>'"></div><div class="device-meta">${d.brand} · ${d.type==='watch'?'WATCH':'TABLET'}</div><div class="product-name">${d.name}</div><div class="device-plan">${d.plan}</div><div class="device-price">${d.price?`월 <strong>${money(d.price)}</strong>~`:'가격 상담'}</div></a>`}
function draw(){let x=deviceList.filter(d=>df==='all'||d.category===df||d.type===df);deviceGrid.innerHTML=x.map(deviceCard).join('')}
draw();document.querySelectorAll('[data-dfilter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-dfilter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');df=b.dataset.dfilter;draw()});sort.onchange=e=>{let v=e.target.value;deviceList=[...KTMART_DEVICES].sort((a,b)=>v==='low'?((a.price||999999)-(b.price||999999)):v==='high'?((b.price||0)-(a.price||0)):0);draw()};
</script></body></html>
