<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>워치와 태블릿도 함께 | KT마트</title><link rel="stylesheet" href="assets/styles.css"></head><body><main><section class="page-hero"><div class="container"><div class="section-eyebrow">워치/태블릿</div><h1>워치와 태블릿도 함께</h1><p class="section-desc">휴대폰과 함께 사용할 웨어러블·태블릿 상담을 접수하세요.</p></div></section><section class="products-section"><div class="container"><div class="toolbar"><div class="filter-row"><button class="tab active" data-filter="all">전체</button><button class="tab" data-filter="samsung">삼성</button><button class="tab" data-filter="apple">애플</button></div><select class="sort-select" id="sort"><option value="recommend">추천순</option><option value="low">월 납부 낮은순</option><option value="high">월 납부 높은순</option></select></div><div class="product-grid" id="productGrid"></div></div></section></main><script src="assets/data.js"></script><script src="assets/app.js"></script><script>base('devices');let list=[...KTMART_PRODUCTS];renderProducts('#productGrid',list);setupFilters();document.getElementById('sort').onchange=e=>{let v=e.target.value;list=[...KTMART_PRODUCTS].sort((a,b)=>v==='low'?((a.price||999999)-(b.price||999999)):v==='high'?(b.price-a.price):0);renderProducts('#productGrid',list);setupFilters();}</script></body></html>
