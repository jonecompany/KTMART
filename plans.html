<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KT 요금제 | KT마트</title><link rel="stylesheet" href="assets/styles.css"></head><body><main><section class="page-hero"><div class="container"><div class="section-eyebrow">요금제</div><h1>내 사용량에 맞는<br>KT 요금제</h1><p class="section-desc">대표 요금제를 비교하고 상담을 신청하세요.</p></div></section><section class="products-section"><div class="container"><div class="product-grid" id="planCards"></div></div></section></main><script src="assets/data.js"></script><script src="assets/app.js"></script><script>base('plans');planCards.innerHTML=KTMART_PLANS.map(p=>`<div class="product-card"><span class="badge">5G</span><div style="height:145px;border-radius:16px;background:linear-gradient(135deg,#f4f5ff,#fff4f7);display:grid;place-items:center;font-size:50px">📶</div><div class="product-name" style="margin-top:18px">${p.name}</div><p class="subtle">${p.data}<br>통화 무제한 · 문자 기본제공</p><div class="product-price">월 <strong>${money(p.price)}</strong></div><a class="btn btn-outline" style="width:100%;margin-top:18px" href="consult.html?plan=${encodeURIComponent(p.name)}">이 요금제로 상담</a></div>`).join('')</script></body></html>
