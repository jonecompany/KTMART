<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="KT마트 KT 모바일 요금제 전체 안내"><title>KT 요금제 전체보기 | KT마트</title><link rel="stylesheet" href="assets/styles.css"></head><body><main>
<section class="page-hero"><div class="container"><div class="section-eyebrow">KT 요금제</div><h1>KT 요금제를<br>한 번에 비교하세요</h1><p class="section-desc">추천요금제는 초이스110 유튜브 프리미엄 하나만 강조하고, 아래에서 KT 요금제를 카테고리별로 확인할 수 있습니다.</p></div></section>
<section class="products-section"><div class="container">
<div class="plan-recommend" id="recommend"></div>
<div class="plan-toolbar" id="planToolbar"></div>
<div id="planSections"></div>
<div class="source-note">※ 요금제 명칭·월정액은 KT 공식 상품/온라인샵에서 확인 가능한 기준으로 구성했습니다. 가입 가능 여부, 제휴 콘텐츠, 할인·프로모션, 선택약정/다이렉트 할인 적용 여부는 가입 시점에 따라 달라질 수 있으므로 상담 시 최종 확인해 주세요.</div>
</div></section></main>
<script src="assets/data.js"></script><script src="assets/app.js"></script><script>
base('plans');
const r=KTMART_RECOMMENDED_PLAN;
recommend.innerHTML=`<div><span class="recommend-label">KT마트 추천요금제</span><h2>${r.name}</h2><p>${r.data}<br>${r.desc}</p><a class="btn kakao-inline" style="margin-top:18px" target="_blank" rel="noopener" href="https://open.kakao.com/o/scIxquKi">카카오톡으로 바로 상담</a></div><div class="recommend-price"><span>월정액</span><strong>${money(r.price)}</strong><a class="btn btn-light" style="margin-top:12px" href="consult.html?plan=${encodeURIComponent(r.name)}">상담 신청</a></div>`;
planToolbar.innerHTML=KTMART_PLAN_GROUPS.map(g=>`<a class="tab" href="#${g.id}">${g.name}</a>`).join('');
planSections.innerHTML=KTMART_PLAN_GROUPS.map(g=>`<section class="plan-section" id="${g.id}"><div class="plan-section-head"><h3>${g.name}</h3><span class="plan-count">${g.plans.length}개 요금제</span></div><div class="plan-table">${g.plans.map(p=>`<div class="plan-row"><div class="name">${p.name}</div><div class="data">${p.data||'상담 시 상세 안내'}</div><div class="fee">${p.price?money(p.price):'상담 확인'}</div><a class="btn btn-outline" href="consult.html?plan=${encodeURIComponent(p.name)}">상담</a></div>`).join('')}</div></section>`).join('');
</script></body></html>
