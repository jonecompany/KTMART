<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>원하는 휴대폰을 한눈에 비교하세요 | KT마트</title><link rel="stylesheet" href="assets/styles.css"></head><body><main><section class="page-hero"><div class="container"><div class="section-eyebrow">휴대폰</div><h1>원하는 휴대폰을 한눈에 비교하세요</h1><p class="section-desc">KT마트 추천 모델을 브랜드별로 보고 월 예상 납부액을 확인할 수 있습니다.</p></div></section><section class="products-section"><div class="container"><div class="toolbar"><div class="filter-row"><button class="tab active" data-filter="all">전체</button><button class="tab" data-filter="samsung">삼성</button><button class="tab" data-filter="apple">애플</button></div><select class="sort-select" id="sort"><option value="recommend">추천순</option><option value="low">월 납부 낮은순</option><option value="high">월 납부 높은순</option></select></div><div class="product-grid" id="productGrid"></div></div></section></main><script src="assets/data.js"></script><script src="assets/app.js"></script><script>base('phones');let list=[...KTMART_PRODUCTS];renderProducts('#productGrid',list);setupFilters();document.getElementById('sort').onchange=e=>{let v=e.target.value;list=[...KTMART_PRODUCTS].sort((a,b)=>v==='low'?((a.price||999999)-(b.price||999999)):v==='high'?(b.price-a.price):0);renderProducts('#productGrid',list);setupFilters();}</script></body></html>
