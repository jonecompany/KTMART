<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상품 상세 | KT마트</title><link rel="stylesheet" href="assets/styles.css"></head><body><main><section class="detail"><div class="container detail-grid"><div class="detail-visual"><img id="pimg" alt="상품 이미지"></div><div><div class="section-eyebrow" id="pbrand"></div><h1 id="pname"></h1><p class="subtle" id="pstorage"></p>
<div class="option-group"><h4>서비스 선택</h4><div class="seg"><button class="choice active" data-group="service" data-value="move">번호이동</button><button class="choice" data-group="service" data-value="change">기기변경</button></div></div>
<div class="option-group"><h4>연령 혜택</h4><div class="seg three"><button class="choice active" data-group="age" data-value="general">일반</button><button class="choice" data-group="age" data-value="y">Y (19~34세)</button><button class="choice" data-group="age" data-value="senior">시니어</button></div></div>
<div class="option-group"><h4>할인 방법</h4><div class="seg"><button class="choice active" data-group="discount" data-value="device">기기할인</button><button class="choice" data-group="discount" data-value="plan">요금할인 25%</button></div></div>
<div class="option-group"><h4>할부 개월</h4><div class="seg three"><button class="choice active" data-group="months" data-value="24">24개월</button><button class="choice" data-group="months" data-value="30">30개월</button><button class="choice" data-group="months" data-value="36">36개월</button></div></div>
<div class="option-group"><h4>요금제 선택</h4><div class="plan-list" id="plans"></div></div>
<div class="order-box"><div class="order-line"><span>출고가</span><b id="devicePrice"></b></div><div class="order-line"><span>예상 기기 지원</span><b id="support"></b></div><div class="order-line"><span>월 기기 할부금</span><b id="deviceMonthly"></b></div><div class="order-line"><span>월 통신요금</span><b id="planMonthly"></b></div><div class="order-total"><span>월 예상 금액</span><strong id="total"></strong></div><p style="color:#9ca3af;font-size:12px;line-height:1.6">※ 실제 개통 금액은 가입 조건, 공시지원금, 선택약정, 결합 및 시점에 따라 달라질 수 있습니다.</p><a class="btn btn-primary" id="consultBtn" style="width:100%;margin-top:8px">이 조건으로 상담 신청</a></div></div></div></section></main>
<script src="assets/data.js"></script><script src="assets/app.js"></script><script>
base('phones');const id=new URLSearchParams(location.search).get('id')||'iphone17pro';const p=KTMART_PRODUCTS.find(x=>x.id===id)||KTMART_PRODUCTS[0];saveRecent(p.id);pimg.src=p.img;pbrand.textContent=p.brand;pname.textContent=p.name;pstorage.textContent=p.storage+' · 색상 '+p.colors.join(' / ');devicePrice.textContent=money(p.devicePrice);let state={service:'move',age:'general',discount:'device',months:24,plan:KTMART_PLANS[0]};
plans.innerHTML=KTMART_PLANS.map((x,i)=>`<div class="plan ${i===0?'active':''}" data-id="${x.id}"><div><strong>${x.name}</strong><span class="subtle">${x.data} · 통화/문자 기본제공</span></div><b>${money(x.price)}</b></div>`).join('');
function calc(){if(!p.devicePrice){support.textContent='출시 후 안내';deviceMonthly.textContent='상담';planMonthly.textContent=money(state.plan.price);total.textContent='사전예약 상담';return}let sup=p.support+(state.service==='move'?80000:0);let principal=Math.max(0,p.devicePrice-(state.discount==='device'?sup:0));let dm=Math.round(principal/state.months*1.059);let pm=Math.round(state.plan.price*(state.discount==='plan'?.75:1));support.textContent='-'+money(state.discount==='device'?sup:0);deviceMonthly.textContent=money(dm);planMonthly.textContent=money(pm);total.textContent=money(dm+pm)}
$$('.choice').forEach(b=>b.onclick=()=>{$$(`.choice[data-group="${b.dataset.group}"]`).forEach(x=>x.classList.remove('active'));b.classList.add('active');state[b.dataset.group]=b.dataset.group==='months'?Number(b.dataset.value):b.dataset.value;calc()});$$('.plan').forEach(el=>el.onclick=()=>{$$('.plan').forEach(x=>x.classList.remove('active'));el.classList.add('active');state.plan=KTMART_PLANS.find(x=>x.id===el.dataset.id);calc()});consultBtn.onclick=()=>location.href=`consult.html?model=${encodeURIComponent(p.name)}&plan=${encodeURIComponent(state.plan.name)}&service=${state.service}`;calc();
</script></body></html>
