script src="assets/data.js"></script><script src="assets/app.js"></script><script>base('');const q=new URLSearchParams(location.search);if(q.get('model'))model.value=q.get('model');if(q.get('plan'))plan.value=q.get('plan');if(q.get('service'))service.value=q.get('service')==='move'?'번호이동':'기기변경';</script></body></html>
